name: tests

# Su main e su ogni pull request. Il push e' filtrato su main apposta: senza il
# filtro un branch aperto nello stesso repo farebbe girare due volte lo stesso
# job, una per il push e una per la PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # 3.11 e' il minimo dichiarato in requirements.txt, 3.14 la piu' recente.
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Solo flask e pymupdf: bastano per importare src/app/app.py (torch e
      # transformers si caricano pigri in load_model(), mai chiamato dai test,
      # che sostituiscono il modello con un finto). Cosi' girano anche i test
      # HTTP e PDF, che senza queste due librerie venivano saltati. torch resta
      # fuori: costerebbe minuti e gigabyte e l'inferenza vera non e' sotto test.
      # Versioni allineate a requirements.txt.
      - name: dipendenze dei test (flask, pymupdf)
        run: python -m pip install "flask==3.1.3" "pymupdf==2.1"

      # Nessun test deve risultare saltato: un test che si salta da solo per una
      # dipendenza mancante e' un test che non protegge piu' niente.
      - name: unittest discover
        run: |
          python -m unittest discover -v tests 2>&1 | tee unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "skipped=" unittest.log; then
            echo "::error::test saltati: controlla le dipendenze" && exit 1
          fi
