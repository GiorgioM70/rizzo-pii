name: ocr-macos

# OCR delle scansioni con il framework Vision: gira solo su macOS. Compila
# rizzo-ocr come build_macos.sh, fa girare tutti i test (sul Mac il motore vero
# e' presente: i test che lo escludono devono continuare a passare) e poi quelli
# che usano Vision davvero (tests/macos/).
on:
  push:
    paths:
      - "src/app/**"
      - "tests/**"
      - "build_sidecar.spec"
      - "build_macos.sh"
      - ".github/workflows/ocr-macos.yml"
  pull_request:
    paths:
      - "src/app/**"
      - "tests/**"
      - "build_sidecar.spec"
      - "build_macos.sh"
      - ".github/workflows/ocr-macos.yml"

permissions:
  contents: read

concurrency:
  group: ocr-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vision:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: dipendenze dei test (flask, pymupdf)
        run: python -m pip install "flask==3.1.3" "pymupdf==1.28.2"

      - name: compila rizzo-ocr (Swift + Vision)
        run: |
          mkdir -p build/ocr
          swiftc -O -target "$(uname -m)-apple-macos11" \
            -o build/ocr/rizzo-ocr src/app/ocr_macos/main.swift
          build/ocr/rizzo-ocr --version

      - name: unittest discover (con il motore OCR presente)
        run: |
          python -m unittest discover -v tests 2>&1 | tee unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "skipped=" unittest.log; then
            echo "::error::test saltati: controlla le dipendenze" && exit 1
          fi

      - name: OCR vero con Vision
        run: |
          python tests/macos/test_ocr_vision.py 2>&1 | tee vision.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "skipped" vision.log; then
            echo "::error::OCR Vision non provato" && exit 1
          fi
